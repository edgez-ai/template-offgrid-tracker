# Run from firmware/:
#   openocd -f scripts/flash_camera_openocd.cfg
# Connect the probe's nRESET pin as well as SWDIO, SWCLK, GND and target Vref.
# The CPU stays halted after verification; issue `reset run` when ready to boot.

if {![info exists CAMERA_IMAGE]} {
    set CAMERA_IMAGE .pio/build/edgez-nrf54l15-vc0706-camera-sensor/firmware.hex
}
if {![file exists $CAMERA_IMAGE]} {
    error "Camera firmware image does not exist: $CAMERA_IMAGE"
}

source [find interface/cmsis-dap.cfg]
cmsis-dap backend hid
source [find target/nordic/nrf54l.cfg]
adapter speed 100

# Assert hardware RESET while attaching, before the old application can run.
reset_config srst_only srst_nogate connect_assert_srst
adapter srst pulse_width 100
init
reset halt
if {[nrf54l.cpu curstate] ne "halted"} {
    error "Refusing to program: the nRF54L15 CPU is not halted"
}

# Program only the HEX image, commit the last buffered RRAM write, then verify.
# No mass erase/recover: factory identity and settings partitions are retained.
mww 0x5004b500 0x101
load_image $CAMERA_IMAGE
mww 0x5004b008 1
sleep 10
mww 0x5004b500 0
verify_image $CAMERA_IMAGE
halt
echo "Camera image verified. CPU HALTED; application has not been started."
shutdown
