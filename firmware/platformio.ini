[platformio]
default_envs = waveshare-esp32-p4
src_dir = main

[env]
monitor_speed = 115200

[esp32]
; Keep this aligned with template-live-stocking. The pinned pioarduino release
; supplies ESP-IDF 5.5.5, including the ESP32-P4 revision 3 linker fix.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
extra_scripts = pre:scripts/select_esp32_sdkconfig.py
upload_protocol = esptool
monitor_filters = esp32_exception_decoder

[env:waveshare-esp32-p4]
extends = esp32
board = esp32-p4-evboard
upload_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; Dedicated receiver for the nRF54 connectionless PAwR bulk-transfer suite.
; It validates 32/64 KiB deterministic streams and prints one result per case.
[env:waveshare-esp32-p4-pawr-bulk-test]
extends = esp32
board = esp32-p4-evboard
upload_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

[env:esp32-s3-pawr]
extends = esp32
board = esp32-s3-devkitc1-n8r8
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.esp32s3.csv

; Heltec HT-HC33 (ESP32-S3 + MM6108), matching template-live-stocking.
[env:heltec-hc33]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; HT-HC33 low-power connectionless sensor. This intentionally excludes BLE,
; mesh peering, BATMAN and MQTT; it uses factory identity zero-touch discovery
; followed by periodic PAwR Beacon requests, matching the nRF54 sensor role.
[env:ht-hc33-sensor]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; Button-triggered HaLow wake sender. The radio is fixed to US channel 25
; (914.5 MHz / 1 MHz)
; and broadcasts a wake burst for every HC33 USER button press so a sleeping
; receiver can detect it during a duty-cycled listen window.
[env:ht-hc33-halow-wake-test]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; HT-HC33 mesh power test: baseline after peering, then MM6108 PS enabled.
[env:heltec-hc33-mesh-ps]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

[nrf54]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-nrf54l15
platform_packages =
  framework-zephyr-nrf54l15 @ https://dl.registry.platformio.org/download/platformio/tool/framework-zephyr/3.40400.260428/framework-zephyr-3.40400.260428.tar.gz
  platformio/toolchain-gccarmnoneeabi @ ~1.90201.0
extra_scripts = pre:scripts/pre_build_firmware_nrf54.py
board_build.zephyr.app_build_control = true

; Official Seeed XIAO nRF54L15 Sense with the FGH100M/MM6108 shield.
[env:seeed-xiao-nrf54l15-sense]
extends = nrf54
upload_protocol = pyocd
debug_tool = cmsis-dap
custom_zephyr_extra_conf = zephyr/boards/xiao_nrf54l15_sense.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/xiao_nrf54l15_sense.overlay
  -DMORSE_BINARY_VARIANT=sense

; Seeed XIAO nRF54L15 with the Heltec HT-HC01 V2/MM6108 carrier.
[env:seeed-xiao-nrf54l15-hc01]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_zephyr_extra_conf = zephyr/hc01.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/xiao_nrf54l15_hc01.overlay

; EdgeZ nRF54L15 + FGH200M/MM8108 BLE companion. The Seeed board ID is used
; only as the PlatformIO/Zephyr nRF54L15 CPU base; this overlay defines the
; actual EdgeZ carrier wiring.
[env:edgez-nrf54l15-fgh200m-companion]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_companion.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_companion.overlay

; Dedicated low-power HaLow sensor: no Bluetooth host/controller, no companion
; mesh services, accelerometer-only FIFO, and no console/RTT logs.
[env:edgez-nrf54l15-fgh200m-sensor]
extends = nrf54
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 1000
board_debug.openocd_target = target/nordic/nrf54l.cfg
extra_scripts = ${nrf54.extra_scripts}, post:scripts/nrf54_openocd_upload.py
debug_load_cmds =
  monitor reset halt
  monitor mww 0x5004b500 0x101
  load
  monitor mww 0x5004b500 0
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_sensor.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_sensor.overlay

; Functional sensor validation with RTT logs. Unlike the bulk-test image this
; follows the production discovery, acceptance, telemetry, and downlink paths.
[env:edgez-nrf54l15-fgh200m-sensor-debug]
extends = nrf54
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = ${env:edgez-nrf54l15-fgh200m-sensor.debug_speed}
board_debug.openocd_target = ${env:edgez-nrf54l15-fgh200m-sensor.board_debug.openocd_target}
extra_scripts = ${env:edgez-nrf54l15-fgh200m-sensor.extra_scripts}
debug_load_cmds = ${env:edgez-nrf54l15-fgh200m-sensor.debug_load_cmds}
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_sensor.conf,zephyr/fgh200m_sensor_debug.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_sensor.overlay

; Factory comparison of announced and unannounced native TWT agreements.
[env:edgez-nrf54l15-fgh200m-twt-unannounced-test]
extends = env:edgez-nrf54l15-fgh200m-sensor-debug
custom_zephyr_extra_conf = ${env:edgez-nrf54l15-fgh200m-sensor-debug.custom_zephyr_extra_conf},zephyr/fgh200m_sensor_twt_unannounced.conf

; Same announced factory experiment without logging, RTT or RF snapshots.
[env:edgez-nrf54l15-fgh200m-twt-quiet-test]
extends = env:edgez-nrf54l15-fgh200m-sensor-debug
custom_zephyr_extra_conf = zephyr/fgh200m_sensor.conf,zephyr/fgh200m_sensor_twt_quiet.conf

; Quiet CPU with one bounded firmware sleep-statistics query for comparison.
[env:edgez-nrf54l15-fgh200m-twt-sleep-audit]
extends = env:edgez-nrf54l15-fgh200m-twt-quiet-test
custom_zephyr_extra_conf = ${env:edgez-nrf54l15-fgh200m-twt-quiet-test.custom_zephyr_extra_conf},zephyr/fgh200m_sensor_twt_sleep_audit.conf

; Original carrier benchmark, restored from 7cd0672 for comparison.
[env:edgez-nrf54l15-fgh200m-all-off]
extends = nrf54
extra_scripts = pre:scripts/pre_build_fgh200m_all_off.py
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
custom_zephyr_extra_conf = zephyr/fgh200m_all_off.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DOFFGRID_NRF54_ALL_OFF_BENCHMARK=ON
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_all_off.overlay

[env:edgez-nrf54l15-fgh200m-all-off-system-on]
extends = env:edgez-nrf54l15-fgh200m-all-off
custom_zephyr_extra_conf = zephyr/fgh200m_all_off_system_on.conf

; Dedicated sender for the connectionless PAwR bulk-transfer suite. The base
; sensor config remains unchanged; this environment only layers test settings.
[env:edgez-nrf54l15-fgh200m-sensor-bulk-test]
extends = nrf54
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = ${env:edgez-nrf54l15-fgh200m-sensor.debug_speed}
board_debug.openocd_target = ${env:edgez-nrf54l15-fgh200m-sensor.board_debug.openocd_target}
extra_scripts = ${env:edgez-nrf54l15-fgh200m-sensor.extra_scripts}
debug_load_cmds = ${env:edgez-nrf54l15-fgh200m-sensor.debug_load_cmds}
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_sensor.conf,zephyr/fgh200m_sensor_bulk_test.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_sensor.overlay
