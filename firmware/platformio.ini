[platformio]
default_envs = waveshare-esp32-p4
src_dir = main

[env]
monitor_speed = 115200

[esp32]
; Keep this aligned with template-live-stocking. The pinned pioarduino release
; supplies ESP-IDF 5.5.5, including the ESP32-P4 revision 3 linker fix.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
extra_scripts = pre:scripts/select_esp32_sdkconfig.py
upload_protocol = esptool
monitor_filters = esp32_exception_decoder

[env:waveshare-esp32-p4]
extends = esp32
board = esp32-p4-evboard
upload_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

[env:esp32-s3-pawr]
extends = esp32
board = esp32-s3-devkitc1-n8r8
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.esp32s3.csv

; Heltec HT-HC33 (ESP32-S3 + MM6108), matching template-live-stocking.
[env:heltec-hc33]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

; HT-HC33 mesh power test: baseline after peering, then MM6108 PS enabled.
[env:heltec-hc33-mesh-ps]
extends = esp32
board = heltec_wifi_lora_32_V3
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

[nrf54]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-nrf54l15
platform_packages =
  framework-zephyr-nrf54l15 @ https://dl.registry.platformio.org/download/platformio/tool/framework-zephyr/3.40400.260428/framework-zephyr-3.40400.260428.tar.gz
  platformio/toolchain-gccarmnoneeabi @ ~1.90201.0
extra_scripts = pre:scripts/pre_build_firmware_nrf54.py
board_build.zephyr.app_build_control = true

; Official Seeed XIAO nRF54L15 Sense with the FGH100M/MM6108 shield.
[env:seeed-xiao-nrf54l15-sense]
extends = nrf54
upload_protocol = pyocd
debug_tool = cmsis-dap
custom_zephyr_extra_conf = zephyr/boards/xiao_nrf54l15_sense.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/xiao_nrf54l15_sense.overlay
  -DMORSE_BINARY_VARIANT=sense

; Seeed XIAO nRF54L15 with the Heltec HT-HC01 V2/MM6108 carrier.
[env:seeed-xiao-nrf54l15-hc01]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_zephyr_extra_conf = zephyr/hc01.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/xiao_nrf54l15_hc01.overlay

; EdgeZ nRF54L15 board with the FGH200M/MM8108 module. The Seeed board ID is
; used only as the PlatformIO/Zephyr nRF54L15 CPU base; this overlay defines
; the actual EdgeZ carrier wiring.
[env:edgez-nrf54l15-fgh200m]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m.overlay

; Current-measurement image: accelerometer-only FIFO and no console/RTT logs.
[env:edgez-nrf54l15-fgh200m-power]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_power.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_power.overlay

; Diagnostic A/B image: same complete sensor application and IMU workload as
; the power image, with every periodic HaLow wake/transmission suppressed.
[env:edgez-nrf54l15-fgh200m-power-no-halow]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_power_no_halow.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_power.overlay

; Stricter full-application A/B image: HaLow never transmits and the IMU rail
; remains off with its bus pins unclaimed. This distinguishes sensor current
; from the nRF54L15/System-ON application baseline.
[env:edgez-nrf54l15-fgh200m-power-no-radios]
extends = nrf54
upload_protocol = jlink
debug_tool = jlink
custom_morse_chip = mm8108
custom_zephyr_extra_conf = zephyr/fgh200m_power_no_radios.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_power_no_radios.overlay

; Minimum-current bench image for the EdgeZ nRF54L15 + FGH200M carrier.
; Every sensor/radio rail is off, connected pins are isolated, and the MCU
; enters System OFF. This deliberately contains no application networking.
[env:edgez-nrf54l15-fgh200m-all-off]
extends = nrf54
extra_scripts = pre:scripts/pre_build_fgh200m_all_off.py
upload_protocol = jlink
debug_tool = jlink
custom_zephyr_extra_conf = zephyr/fgh200m_all_off.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DOFFGRID_NRF54_ALL_OFF_BENCHMARK=ON
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_all_off.overlay

; Same complete external-peripheral isolation as the all-off benchmark, but
; stay in tickless System ON idle for an apples-to-apples WFI baseline.
[env:edgez-nrf54l15-fgh200m-all-off-system-on]
extends = nrf54
extra_scripts = pre:scripts/pre_build_fgh200m_all_off.py
upload_protocol = jlink
debug_tool = jlink
custom_zephyr_extra_conf = zephyr/fgh200m_all_off_system_on.conf
board_build.zephyr.cmake_extra_args =
  -DKCONFIG_ERROR_ON_WARNINGS=OFF
  -DOFFGRID_NRF54_ALL_OFF_BENCHMARK=ON
  -DDTC_OVERLAY_FILE=boards/edgez_nrf54l15_fgh200m_all_off.overlay
