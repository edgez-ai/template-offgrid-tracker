# Minimal FGH200M board-leakage benchmark using tickless System ON idle.
# No application, BLE, Wi-Fi, radio driver, sensor, console, or logging exists.
CONFIG_OFFGRID_NRF54_ALL_OFF_SYSTEM_ON=y
CONFIG_GPIO=y
CONFIG_POWEROFF=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_ASYNC_API=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_RTT_CONSOLE=n

CONFIG_BT=n
CONFIG_NETWORKING=n
CONFIG_WIFI=n
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_SENSOR=n
CONFIG_ADC=n
CONFIG_SHELL=n
CONFIG_REBOOT=n
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_SETTINGS=n
CONFIG_FLASH_MAP=n
CONFIG_JSON_LIBRARY=n
