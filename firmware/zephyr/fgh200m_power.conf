# FGH200M/MM8108 low-power current-measurement image.
CONFIG_WIFI_MORSEMICRO_TEST=y
CONFIG_WIFI_MORSEMICRO_EDGEZ_JOIN_ONLY=y
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Keep the LSM6DSL gyroscope off and wake the MCU only for batched
# accelerometer FIFO data.
CONFIG_OFFGRID_NRF54_IMU_ACCEL_ONLY=y
CONFIG_OFFGRID_NRF54_IMU_TIMER_DRAIN=y

# Keep the MM8108 firmware and PAwR-only interface initialized, but allow the
# chip to sleep between reports. This removes the full HaLow boot from every
# 15-second cycle so wake-to-transmit latency and average energy can be compared
# against the previous rail-off implementation.
CONFIG_OFFGRID_NRF54_SENSOR_HALOW_POWER_SAVE=y

# Do not build or wake the L76K in this sensor image. The board overlay keeps
# its power control low and leaves the UART pins isolated. GPS remains present
# in the normal FGH200M image and can be re-enabled here later.
CONFIG_OFFGRID_NRF54_SENSOR_GPS=n

# Battery voltage is intentionally unavailable in the current-measurement
# image.  Keeping the SAADC device enabled costs about 70 uA on the measured
# FGH200M carrier even though this board does not expose a supported battery
# channel to edgez_battery.  Disable the driver completely between builds
# rather than merely skipping application reads.
CONFIG_ADC=n

# Make the long 15-second reporting interval a single tickless System ON idle
# residency. Device PM is also required by the explicit SPI/I2C/UART suspend
# paths used around radio and sensor activity.
CONFIG_TICKLESS_KERNEL=y
CONFIG_PM_DEVICE=y
# Keep kernel time aligned with the 32.768 kHz low-frequency source used by
# the validated FGH200M System-ON sensor reference.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768

# Remove log formatting, RTT transfers, and console activity from power tests.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_RTT_CONSOLE=n
