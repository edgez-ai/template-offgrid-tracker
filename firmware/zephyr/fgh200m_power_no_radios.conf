# FGH200M full-application A/B current diagnostic. Both the MM8108 reporting
# path and LSM6DSL are disabled while the application retains its normal
# System ON tickless sleep and persistent sensor profile.
CONFIG_WIFI_MORSEMICRO_TEST=y
CONFIG_WIFI_MORSEMICRO_EDGEZ_JOIN_ONLY=y
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_OFFGRID_NRF54_IMU_ACCEL_ONLY=y
CONFIG_OFFGRID_NRF54_IMU_TIMER_DRAIN=y
CONFIG_OFFGRID_NRF54_SENSOR_GPS=n
CONFIG_OFFGRID_NRF54_SENSOR_NO_HALOW_TEST=y
CONFIG_OFFGRID_NRF54_SENSOR_NO_IMU_TEST=y
CONFIG_OFFGRID_NRF54_FORCED_IDLE_TEST=y

# Compile the complete application contract with BLE stubbed out. This removes
# the Zephyr Bluetooth host/controller, radio scheduler, buffers, and stacks so
# this A/B image can quantify their retained-RAM and idle-current cost.
CONFIG_BT=n
# HaLow security still uses PSA even though the BLE host/controller is absent.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

CONFIG_TICKLESS_KERNEL=y
CONFIG_PM_DEVICE=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768

CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_RTT_CONSOLE=n
