# Functional PAwR sensor validation with RTT logs.
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Exercise the production telemetry and downlink state machine while keeping
# MM8108 awake long enough for interactive RTT verification.
CONFIG_OFFGRID_NRF54_SENSOR_PAWR_BULK_TEST=n
CONFIG_OFFGRID_NRF54_SENSOR_HALOW_POWER_SAVE=n
