# Fixed-profile EdgeZ UMAC validation image. The Morse device is registered as
# a raw device only; no Zephyr network interface or IP/extender stack is used.
CONFIG_WIFI_MORSEMICRO_TEST=y
CONFIG_WIFI_MORSEMICRO_EDGEZ_JOIN_ONLY=y
CONFIG_NET_DHCPV4=n
# Zephyr's Wi-Fi subsystem selects the native network core, which requires one
# packet protocol. Keep IPv4 enabled for that invariant, but do not configure
# an address, DHCP client, gateway, sockets, or extender behavior.
CONFIG_NET_IPV4=y
# Zephyr unconditionally compiles subsys/net/ip/connection.c when NET_IP is
# enabled, but only defines CONFIG_NET_MAX_CONN when at least one transport is
# selected. Keep one dormant UDP connection slot so the native IP core links;
# the join-only application never configures an address or opens a socket.
CONFIG_NET_UDP=y
CONFIG_NET_MAX_CONN=1
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=n
CONFIG_SHELL=n
CONFIG_NET_SHELL=n

# EdgeZ SAE uses the public legacy ECP point-arithmetic API. The P256-M PSA
# driver advertises complete acceleration and therefore compiles that API out;
# use Mbed TLS' software secp256r1 provider for this join-only image.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# The private SAE/AMPE provider and RF driver need additional worker/heap room.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
