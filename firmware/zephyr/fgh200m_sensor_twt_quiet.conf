# Keep the factory TWT/USER path identical while removing diagnostic wakeups.
# Passive counters remain readable after the functional test; no RF sleep or
# current claim follows from those counters.
CONFIG_OFFGRID_NRF54_SENSOR_RX_SLEEP_COMPARE=y
CONFIG_OFFGRID_NRF54_SENSOR_TWT_PROBE=y
CONFIG_OFFGRID_NRF54_SENSOR_TWT_STATE_PROBE=y
CONFIG_OFFGRID_NRF54_SENSOR_PAWR_TWT_TEST=y
CONFIG_OFFGRID_NRF54_SENSOR_TWT_BEACON_SYNC_TEST=y
CONFIG_OFFGRID_NRF54_SENSOR_TWT_AP_BSSID_TEST=y
CONFIG_OFFGRID_NRF54_SENSOR_BOOTSTRAP_INTERVAL_SECONDS=60
CONFIG_OFFGRID_NRF54_SENSOR_TWT_MAC_SNAPSHOT=n
CONFIG_OFFGRID_NRF54_SENSOR_TWT_UNANNOUNCED_TEST=n
