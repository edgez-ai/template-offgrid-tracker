# Keep RTT enabled by prj.conf and mirror Zephyr logs to UART20, exposed as the
# onboard CMSIS-DAP virtual COM port. The Sense overlay disables GPS/UART21.
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=4

# Use the protected, platform-independent EdgeZ UMAC core. Platform-specific
# Morse RF and Zephyr SAE glue remain source-built by mm-iot-zephyr.
CONFIG_WIFI_MORSEMICRO_TEST=y
CONFIG_WIFI_MORSEMICRO_EDGEZ_JOIN_ONLY=y

# The EdgeZ SAE/AMPE provider uses the legacy ECP point API. Keep the software
# secp256r1 implementation enabled instead of the PSA-only P256-M driver.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
