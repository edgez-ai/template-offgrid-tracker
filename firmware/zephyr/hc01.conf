# Heltec HC01 MM6108 board configuration recovered from the keepteen history.

# Build the same EdgeZ join-only source integration as the Sense validation
# target. The pre-build script selects bcf_HC01_V2_3V3.mbin from the PlatformIO
# environment name.
CONFIG_WIFI_MORSEMICRO_TEST=y
CONFIG_WIFI_MORSEMICRO_EDGEZ_JOIN_ONLY=y
CONFIG_OFFGRID_NRF54_MESH_PS_TEST=y

# Keep the driver and SAE exchange visible during this hardware experiment.
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=4
# Full Wi-Fi debug logs emit mutex traces continuously over RTT and delay the
# software SAE exchange beyond H7608's four-second retry window. Keep EdgeZ
# diagnostics at debug while limiting the Morse driver module to useful events.
CONFIG_WIFI_LOG_LEVEL_INF=y

# The EdgeZ SAE/AMPE provider uses the legacy ECP point API.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
