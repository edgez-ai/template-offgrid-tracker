# Layer after fgh200m_sensor.conf. Reuse its immutable-identity discovery and
# radio power management, replacing the GPS-only fixed behavior with a camera.
CONFIG_OFFGRID_NRF54_SENSOR_CAMERA=y
CONFIG_OFFGRID_NRF54_SENSOR_GPS_ONLY=n
CONFIG_OFFGRID_NRF54_SENSOR_GPS=n
CONFIG_OFFGRID_NRF54_IMU_TIMER_DRAIN=n
CONFIG_OFFGRID_NRF54_SENSOR_HALOW_POWER_SAVE=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y

# No compiled operational mesh credentials: factory country/channel bootstrap
# discovery; only an accepted, persisted profile enables normal captures.
CONFIG_WIFI_SSID=""
CONFIG_WIFI_PSK=""

# Status logs aid initial bring-up; JPEG bytes travel only over HaLow blocks.
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3
