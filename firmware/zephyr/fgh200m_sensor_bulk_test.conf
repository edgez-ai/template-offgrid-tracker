CONFIG_OFFGRID_NRF54_SENSOR_PAWR_BULK_TEST=y

# The dedicated test image needs visible progress and summary logs.
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Keep the radio awake for the complete multi-kilobyte suite.
CONFIG_OFFGRID_NRF54_SENSOR_HALOW_POWER_SAVE=n
