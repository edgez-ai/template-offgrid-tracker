# FGH200M / MM8108 firmware board configuration.
# The bundled SDK does not yet include Quectel's FGH200M-specific BCF. Use its
# standard MM8108 MF15457 BCF as a bring-up fallback until Quectel supplies the
# matching RF file; replace this value before RF validation/certification.

# Use the same private EdgeZ mesh runtime as the other tracker nRF54 targets.
# This keeps BLE, BATMAN forwarding, profile switching, and beacon handling on
# the public edgez-halow-mesh API instead of pulling in the stock supplicant.
CONFIG_WIFI_MORSEMICRO_TEST=y
CONFIG_WIFI_MORSEMICRO_EDGEZ_JOIN_ONLY=y
CONFIG_OFFGRID_NRF54_ROLE_COMPANION=y

# The EdgeZ SAE/AMPE provider uses the legacy ECP point API.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# Secure peering and the BLE/network packet bridge need more headroom than the
# generic tracker defaults provide during simultaneous startup.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
