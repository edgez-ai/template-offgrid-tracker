name: Build firmware

on:
  workflow_dispatch:
    inputs:
      environment:
        description: PlatformIO environment to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ht-hc33-sensor
          - edgez-nrf54l15-fgh200m-companion
          - edgez-nrf54l15-fgh200m-sensor

# Firmware is intentionally an Actions artifact, never a GitHub Release asset.
permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  compliance:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Check licensing, release policy, and RF boundaries
        run: python3 .github/scripts/check-firmware-compliance.py
      - name: Select build matrix
        id: build-matrix
        shell: bash
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          targets='[
            {"environment":"ht-hc33-sensor","label":"HT-HC33 sensor","artifact":"ht-hc33","image":"firmware.factory.bin","output":"offgrid-tracker-ht-hc33.bin"},
            {"environment":"edgez-nrf54l15-fgh200m-companion","label":"nRF54L15 companion","artifact":"nrf54l15-companion","image":"firmware.hex","output":"offgrid-tracker-nrf54l15-companion.hex"},
            {"environment":"edgez-nrf54l15-fgh200m-sensor","label":"nRF54L15 sensor","artifact":"nrf54l15-sensor","image":"firmware.hex","output":"offgrid-tracker-nrf54l15-sensor.hex"}
          ]'
          if [[ "$SELECTED_ENVIRONMENT" == "all" ]]; then
            matrix="$(jq -cn --argjson include "$targets" '{include: $include}')"
          else
            matrix="$(jq -cn --argjson targets "$targets" --arg environment "$SELECTED_ENVIRONMENT" \
              '{include: [$targets[] | select(.environment == $environment)]}')"
            test "$(jq '.include | length' <<< "$matrix")" -eq 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: compliance
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compliance.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Replace legacy PlatformIO Ninja for nRF
        if: startsWith(matrix.environment, 'edgez-nrf54l15-fgh200m-')
        shell: bash
        run: |
          set -euo pipefail
          pio pkg install \
            --project-dir firmware \
            --environment "${{ matrix.environment }}"
          system_ninja="$(command -v ninja)"
          pio_ninja="$HOME/.platformio/packages/tool-ninja/ninja"
          test -x "$system_ninja"
          test -x "$pio_ninja"
          "$system_ninja" --version
          cp "$system_ninja" "$pio_ninja"
      - name: Build ${{ matrix.environment }}
        run: >-
          pio run
          --project-dir firmware
          --environment "${{ matrix.environment }}"
      - name: Package Actions artifact with licensing and source manifest
        shell: bash
        env:
          PIO_ENV: ${{ matrix.environment }}
          SOURCE_IMAGE: ${{ matrix.image }}
          OUTPUT_NAME: ${{ matrix.output }}
        run: |
          set -euo pipefail
          build_dir="firmware/.pio/build/$PIO_ENV"
          artifact_dir="dist/firmware/$PIO_ENV"
          test -d "$build_dir"
          mkdir -p "$artifact_dir/licenses"

          test -s "$build_dir/$SOURCE_IMAGE"
          cp "$build_dir/$SOURCE_IMAGE" "$artifact_dir/$OUTPUT_NAME"

          cp FIRMWARE-LICENSING.md "$artifact_dir/"
          cp LICENSE "$artifact_dir/licenses/OFFGRID-TRACKER-APACHE-2.0"
          cp firmware/platforms/mm-iot-zephyr/submodules/mm-iot-sdk/LICENSES/* \
            "$artifact_dir/licenses/"
          cp \
            firmware/platforms/mm-iot-zephyr/submodules/edgez-halow-mesh-prebuilt/licenses/* \
            "$artifact_dir/licenses/"
          cp \
            firmware/platforms/mm-iot-zephyr/submodules/morse-firmware/firmware/LICENSE \
            "$artifact_dir/licenses/MORSE-MICRO-FIRMWARE-BDL"
          cp \
            firmware/platforms/mm-iot-zephyr/submodules/morse-firmware/bcf/morsemicro/LICENSE \
            "$artifact_dir/licenses/MORSE-MICRO-BCF-BDL"

          {
            echo "platformio_environment=$PIO_ENV"
            echo "repository_commit=$(git rev-parse HEAD)"
            git submodule status --recursive
          } > "$artifact_dir/SOURCE-MANIFEST.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: offgrid-tracker-${{ matrix.artifact }}
          path: dist/firmware/${{ matrix.environment }}/
          if-no-files-found: error
          retention-days: 7
